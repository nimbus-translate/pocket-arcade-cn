name: Build Harmony Atlas APK
on:
  push:
    branches: [harmony-atlas-app]
    paths:
      - 'harmony-atlas/**'
      - '.github/workflows/build-harmony-atlas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack application source and bundled screenshots
        run: unzip -q harmony-atlas/source.zip -d harmony-atlas
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build offline Android APK
        working-directory: harmony-atlas/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish standalone installable APK
        run: |
          mkdir -p harmony-atlas/download
          cp harmony-atlas/android/app/build/outputs/apk/debug/app-debug.apk harmony-atlas/download/Harmony-Atlas-v1.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harmony-atlas/download/Harmony-Atlas-v1.0.apk
          git commit -m 'Build Android installable APK' || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Harmony-Atlas-Android-APK
          path: harmony-atlas/download/Harmony-Atlas-v1.0.apk
