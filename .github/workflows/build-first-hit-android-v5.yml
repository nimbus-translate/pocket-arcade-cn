name: Build First-Hit Studio v5 Android
on:
  push:
    paths:
      - 'first-hit-native-v5/**'
      - '.github/workflows/build-first-hit-android-v5.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Math engine regression
        run: bash ./tests/run.sh
        working-directory: first-hit-native-v5
      - name: Compile Android APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: first-hit-native-v5
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: first-hit-studio-v5-debug-apk
          path: first-hit-native-v5/app/build/outputs/apk/debug/app-debug.apk
