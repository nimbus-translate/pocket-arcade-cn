name: Build Math Motion Android APK
on:
  push:
    paths:
      - 'math-motion/*.html'
      - 'math-motion/*.css'
      - 'math-motion/*.js'
      - 'math-motion/*.svg'
      - 'math-motion/manifest.webmanifest'
      - 'math-motion-android/**'
      - '.github/workflows/build-math-motion-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify calculator engine
        run: node math-motion-android/tests/run.js
      - name: Embed local web assets
        run: |
          mkdir -p math-motion-android/app/src/main/assets
          cp math-motion/index.html math-motion/style.css math-motion/app.js math-motion/icon.svg math-motion/manifest.webmanifest math-motion/sw.js math-motion-android/app/src/main/assets/
      - name: Build installable debug APK
        working-directory: math-motion-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMotion-Android-APK
          path: math-motion-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK on website
        run: |
          cp math-motion-android/app/build/outputs/apk/debug/app-debug.apk math-motion/MathMotion-v1.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add math-motion/MathMotion-v1.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Math Motion APK [skip ci]'
            git push
          fi