name: Build Zhixu 1.3 unsigned APK for permanent signing
on:
  push:
    branches: [main]
    paths:
      - 'zhixu-build/source-v13.b64'
      - '.github/workflows/build-zhixu-13-unsigned.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unpack version 1.3 source
        run: |
          base64 -d zhixu-build/source-v13.b64 > /tmp/zhixu-13-source.zip
          mkdir zhixu-v13
          unzip -oq /tmp/zhixu-13-source.zip -d zhixu-v13
      - name: Install dependencies and create native project
        working-directory: zhixu-v13
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Set Android version 1.3 (code 13)
        working-directory: zhixu-v13
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s,c=re.subn(r'\bversionCode\s+\d+', 'versionCode 13', s,count=1)
          s,n=re.subn(r'\bversionName\s+["\x27][^"\x27]+["\x27]', 'versionName "1.3"', s,count=1)
          assert (c,n)==(1,1), (c,n)
          p.write_text(s)
          PYFIX
      - name: Build UNSIGNED release APK
        working-directory: zhixu-v13/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package and version metadata
        run: |
          APK=zhixu-v13/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/zhixu-badging.txt
          grep -E "^package: name='app.zhixu.mindspace.v11' versionCode='13' versionName='1.3'" /tmp/zhixu-badging.txt
      - name: Bundle unsigned APK and standard signing tools
        run: |
          mkdir -p unsigned-output
          cp zhixu-v13/android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-output/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" unsigned-output/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" unsigned-output/
      - uses: actions/upload-artifact@v4
        with:
          name: Zhixu-v13-unsigned-and-tools
          path: unsigned-output/
