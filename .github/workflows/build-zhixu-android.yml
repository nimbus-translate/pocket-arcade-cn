name: Build and publish Zhixu Android APK
on:
  push:
    branches: [main]
    paths:
      - 'zhixu-build/**'
      - '.github/workflows/build-zhixu-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unpack Zhixu app source
        run: |
          mkdir -p zhixu-native
          unzip -oq zhixu-build/source.zip -d zhixu-native
      - name: Apply responsive mobile v3 update
        run: |
          base64 -d zhixu-build/mobile-v3.b64 | gzip -d > /tmp/zhixu-mobile-v3.patch
          cd zhixu-native
          patch -p1 --batch --forward < /tmp/zhixu-mobile-v3.patch
          node --check www/app.js
      - name: Install Capacitor dependencies
        working-directory: zhixu-native
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        working-directory: zhixu-native
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable Android APK
        working-directory: zhixu-native/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Android APK archive
        uses: actions/upload-artifact@v4
        with:
          name: Zhixu-Mindspace-Android-APK
          path: zhixu-native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download website and APK
        run: |
          mkdir -p zhixu
          cp -r zhixu-native/www/. zhixu/
          cp zhixu-native/android/app/build/outputs/apk/debug/app-debug.apk zhixu/Zhixu-Mindspace-Android.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zhixu/
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Zhixu Android APK and download site [skip ci]'
            git push origin HEAD:main
          fi
