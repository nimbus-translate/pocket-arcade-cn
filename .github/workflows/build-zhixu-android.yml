name: Build and publish Zhixu Android APK
on:
  push:
    branches: [main]
    paths:
      - 'zhixu-build/**'
      - '.github/workflows/build-zhixu-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unpack Zhixu app source
        run: |
          mkdir -p zhixu-native
          unzip -oq zhixu-build/source.zip -d zhixu-native
      - name: Install Capacitor dependencies
        working-directory: zhixu-native
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        working-directory: zhixu-native
        run: |
          npx cap add android
          npx cap sync android
      - name: Set native Android version to 1.2
        working-directory: zhixu-native
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s, codes = re.subn(r'\bversionCode\s+\d+', 'versionCode 12', s, count=1)
          s, names = re.subn(r'\bversionName\s+["\'][^"\']+["\']', 'versionName "1.2"', s, count=1)
          if codes != 1 or names != 1:
              raise SystemExit(f'Unable to update Android version: code={codes} name={names}')
          p.write_text(s, encoding='utf-8')
          print('Android versionCode=11 versionName=1.2')
          PYFIX
      - name: Build installable Android APK
        working-directory: zhixu-native/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK Android version metadata
        run: |
          APK='zhixu-native/android/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/zhixu-apk-badging.txt
          grep -E "^package: .*versionCode='12' versionName='1.2'" /tmp/zhixu-apk-badging.txt
      - name: Upload Android APK archive
        uses: actions/upload-artifact@v4
        with:
          name: Zhixu-Mindspace-Android-APK
          path: zhixu-native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish download website and APK
        run: |
          mkdir -p zhixu
          cp -r zhixu-native/www/. zhixu/
          cp zhixu-native/android/app/build/outputs/apk/debug/app-debug.apk zhixu/Zhixu-Mindspace-Android.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zhixu/
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Zhixu Android APK and download site [skip ci]'
            git push origin HEAD:main
          fi
