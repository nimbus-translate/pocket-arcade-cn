name: Build First-Hit Studio Android
on:
  push:
    paths:
      - 'first-hit-native-v3/**'
      - '.github/workflows/build-first-hit-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: first-hit-native-v3
      - uses: actions/upload-artifact@v4
        with:
          name: first-hit-studio-v3-debug-apk
          path: first-hit-native-v3/app/build/outputs/apk/debug/app-debug.apk
