<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#f8f8f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="枝序" />
  <meta name="description" content="枝序 — 一个安静、自由的思维导图工作空间。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="mobile-v3.css" />
  <title>枝序 · Mindspace</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-area">
        <div class="brand-emblem" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M10 20H21M21 20L30 11M21 20L30 29"/><circle cx="10" cy="20" r="3.2"/><circle cx="30" cy="11" r="3.2"/><circle cx="30" cy="29" r="3.2"/></svg></div>
        <div class="brand-text"><span class="brand-cn">枝序</span><span class="brand-en">MINDSPACE</span></div>
        <button class="icon-btn sidebar-close mobile-only" id="close-sidebar" aria-label="关闭侧栏">×</button>
      </div>
      <div class="workspace-caption">YOUR SPACE <span class="caption-line"></span> 01</div>
      <div class="sidebar-section-head"><span>我的思维导图</span><span id="doc-count" class="section-count">0</span></div>
      <button class="new-map-btn" id="new-map-btn"><span class="small-plus">＋</span><span>创建新导图</span><span class="new-map-arrow">↗</span></button>
      <div id="doc-list" class="doc-list"></div>
      <div class="sidebar-bottom">
        <div class="small-help"><span class="help-star">✦</span><span>让每个想法，都有生长的空间。</span></div>
        <button id="install-app-btn" class="sidebar-text-btn install-app-btn"><span data-icon="smartphone"></span> 安装到手机 <span class="install-caption install-suffix">添加到主屏幕</span></button>
        <button id="import-btn" class="sidebar-text-btn"><span data-icon="upload"></span> 导入 JSON 备份</button>
        <div class="sidebar-footer">BRANCHES OF THOUGHT <span>© 2026</span></div>
      </div>
    </aside>
    <div id="sidebar-scrim" class="sidebar-scrim"></div>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="menu-btn" title="打开导图列表" aria-label="打开导图列表"><span data-icon="menu"></span></button>
          <span class="top-crumb">工作空间</span><span class="top-divider">/</span>
          <button class="title-button" id="rename-btn" title="重命名导图"><span id="header-title">我的思维导图</span><span data-icon="chevron-down"></span></button>
        </div>
        <div class="topbar-right">
          <span class="saved-state"><span class="saved-dot"></span><span id="save-label">已保存</span></span>
          <span class="top-separator"></span>
          <button class="icon-btn hide-small" id="search-btn" title="搜索节点" aria-label="搜索节点"><span data-icon="search"></span></button>
          <button class="icon-btn" id="undo-btn" title="撤销 Ctrl+Z" aria-label="撤销"><span data-icon="undo"></span></button>
          <button class="icon-btn" id="redo-btn" title="重做 Ctrl+Shift+Z" aria-label="重做"><span data-icon="redo"></span></button>
          <button class="export-btn" id="export-btn"><span data-icon="arrow-up-right"></span><span>导出</span></button>
        </div>
      </header>
      <main class="board-frame">
        <div class="canvas-header">
          <div class="eyebrow">A SPACE TO THINK</div>
          <div class="canvas-title-row"><h1 id="canvas-title">我的思维导图</h1><span class="small-accent-line"></span><span class="node-counter" id="node-count">07 个节点</span></div>
          <p class="canvas-description">点选节点，轻点两次编辑；拖动节点整理思路。</p>
        </div>
        <div class="board" id="board" aria-label="思维导图画布">
          <div class="canvas-content" id="canvas-content">
            <svg id="connectors" class="connectors" viewBox="-5000 -5000 10000 10000" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="nodes-layer"></div>
          </div>
          <div class="canvas-hint" id="canvas-hint"><span data-icon="mouse-pointer"></span> 拖动空白移动画布 · 双指缩放</div>
          <div class="float-tools" id="float-tools">
            <button title="新建子节点" id="add-child-btn"><span data-icon="plus"></span><span>子节点</span></button>
            <span class="tool-divider"></span>
            <button title="新建同级节点" id="add-sibling-btn"><span data-icon="git-branch"></span><span>同级</span></button>
            <span class="tool-divider"></span>
            <button title="编辑选中节点" id="edit-selected-btn"><span data-icon="edit-3"></span><span>编辑</span></button>
            <span class="tool-divider"></span>
            <button title="插入图片" id="add-image-btn"><span data-icon="image"></span><span>图片</span></button>
          </div>
          <div class="zoom-control">
            <button id="zoom-out-btn" title="缩小"><span data-icon="minus"></span></button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in-btn" title="放大"><span data-icon="plus"></span></button>
            <span class="zoom-divider"></span>
            <button id="fit-btn" title="适应画布"><span data-icon="maximize"></span></button>
          </div>
          <div class="board-bottom-left"><span class="presence-dot"></span> PERSONAL CANVAS <span>—</span> PRIVATE & LOCAL</div>
        </div>
      </main>
    </div>

    <aside class="inspector" id="inspector" aria-label="节点编辑器">
      <div class="inspector-head"><div><div class="inspector-eyebrow">NODE EDITOR</div><h2>编辑想法</h2></div><button class="icon-btn" id="close-inspector" aria-label="关闭编辑器"><span data-icon="x"></span></button></div>
      <div class="inspector-scroll">
        <div class="field-block"><label for="node-title-input">节点标题 <span>01</span></label><input id="node-title-input" class="editor-input" maxlength="90" placeholder="为这个想法命名" /></div>
        <div class="field-block"><label for="node-note-input">详细内容 <span>02</span></label><textarea id="node-note-input" class="editor-textarea" maxlength="12000" placeholder="写下你的思考、灵感或待办事项…"></textarea><div class="field-caption">支持多行文字 · 自动保存</div></div>
        <div class="field-block"><label>主题颜色 <span>03</span></label><div id="color-palette" class="color-palette"></div></div>
        <div class="field-block"><label>图片附件 <span>04</span></label><div id="image-list" class="image-list"></div><button class="upload-image" id="editor-image-btn"><span data-icon="image-plus"></span><span>添加图片</span><span class="upload-hint">JPG / PNG / WEBP</span></button></div>
        <div class="field-block"><label>结构 <span>05</span></label><div class="inspector-actions"><button id="editor-child-btn"><span data-icon="plus-circle"></span> 添加子节点</button><button id="editor-sibling-btn"><span data-icon="git-branch"></span> 添加同级</button></div></div>
      </div>
      <div class="inspector-foot"><button id="delete-node-btn" class="delete-btn"><span data-icon="trash"></span> 删除节点</button><span>更改将自动保存</span></div>
    </aside>
    <div class="inspector-scrim" id="inspector-scrim"></div>
    <input id="image-input" type="file" accept="image/*" multiple hidden />
    <input id="import-input" type="file" accept="application/json,.json" hidden />
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="motion.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
